<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Private dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#0f172a;
background:radial-gradient(1200px 600px at 15% -10%,#1e3a5f 0,transparent 60%),radial-gradient(900px 600px at 110% 110%,#0f4c5c 0,transparent 55%),linear-gradient(160deg,#0b1220,#111827 60%,#0b1a24);display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;background:rgba(255,255,255,.96);border-radius:22px;padding:36px 32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.8)}
.dot{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#14b8a6,#2563eb);display:flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 8px 20px rgba(37,99,235,.35)}
h1{font-size:21px;font-weight:650;letter-spacing:-.01em}
p{font-size:14px;color:#64748b;margin-top:6px;line-height:1.5}
label{display:block;font-size:12px;font-weight:600;color:#334155;margin:24px 0 8px;letter-spacing:.02em}
input[type=password]{width:100%;font:inherit;font-size:15px;padding:13px 14px;border:1px solid #cbd5e1;border-radius:12px;outline:none;transition:border .15s,box-shadow .15s}
input[type=password]:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.15)}
.row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:#475569}
button{width:100%;margin-top:20px;font:inherit;font-size:15px;font-weight:600;color:#fff;border:0;border-radius:12px;padding:13px;cursor:pointer;background:linear-gradient(135deg,#0f766e,#1d4ed8);box-shadow:0 10px 24px rgba(29,78,216,.3)}
button:disabled{opacity:.6;cursor:wait}
.err{color:#b91c1c;font-size:13px;margin-top:12px;min-height:18px}
.foot{font-size:11.5px;color:#94a3b8;margin-top:18px;text-align:center}
</style></head><body>

  <h1>Private dashboard</h1>
  <p>This page is encrypted. Enter the password you were given to open it.</p>
  <label for="pw">Password</label>
  <input type="password" id="pw" autofocus required>
  <div class="row"><input type="checkbox" id="rem"><label for="rem" style="margin:0;font-weight:500;color:#475569">Remember on this device until I close the browser</label></div>
  <button id="go" type="submit">Unlock</button>
  <div class="err" id="err"></div>
  <div class="foot">Content is decrypted in your browser only.</div>
</form>

const e64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const SK='pd_k_'+P.s.slice(0,12);
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open_(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(P.i)},key,d64(P.c));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
(async()=>{try{const raw=sessionStorage.getItem(SK);if(raw){const key=await crypto.subtle.importKey('raw',d64(raw),{name:'AES-GCM'},true,['decrypt']);await open_(key)}}catch(e){try{sessionStorage.removeItem(SK)}catch(_){}}})();

 try{const key=await derive(document.getElementById('pw').value);
  let ok=false;try{await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(P.i)},key,d64(P.c));ok=true}catch(_){}
